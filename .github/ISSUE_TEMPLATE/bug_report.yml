name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste absolute file paths, account details or
        screenshots containing personal information.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the demo / a new board
        2. Create a shape and drag it
        3. ……
      description: Minimal steps beat long descriptions.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release version, demo URL or commit hash.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and OS
      placeholder: Chrome 141 / macOS 15
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console output
      description: Errors from the browser console or devtools, if any.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: This report does not contain private data or local absolute paths.
          required: true
        - label: I searched existing issues and did not find a duplicate.
          required: true
