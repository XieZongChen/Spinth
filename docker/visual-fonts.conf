<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Linux 视觉基线字体固定（specs/linux-visual §5.3）：canvas 文字统一走
     sans-serif，官方镜像无 CJK 时会落到 DejaVu 把中文渲染成豆腐块。这里把
     sans-serif 显式 prefer 到 Noto Sans CJK SC——不依赖 LANG 选地域字形，
     避免 JP/KR 字形随 locale 漂移；镜像本身保持 C.UTF-8。 -->
<fontconfig>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans CJK SC</family>
    </prefer>
  </alias>
</fontconfig>
