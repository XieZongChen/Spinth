<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f9fa" />
    <meta
      name="description"
      content="spinth 是本地优先的白板与思维导图编辑器：文档、撤销历史与图片资产全部保存在浏览器本地，无需账号与服务端。"
    />
    <link rel="canonical" href="https://xiezongchen.github.io/Spinth/" />
    <meta name="robots" content="index, follow" />
    <!-- 社交预览用绝对地址（静态 HTML 无法读构建期变量）；换自定义域名时同步改本块与 canonical -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="spinth" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:title" content="spinth — 本地优先的白板与思维导图" />
    <meta
      property="og:description"
      content="无限画布、思维导图、富文本与本地资产库。无账号、无服务端、无埋点，离线也能编辑。"
    />
    <meta property="og:url" content="https://xiezongchen.github.io/Spinth/" />
    <meta property="og:image" content="https://xiezongchen.github.io/Spinth/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="spinth 标志与标语：local-first whiteboard & mind map editor"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="spinth — 本地优先的白板与思维导图" />
    <meta
      name="twitter:description"
      content="无限画布、思维导图、富文本与本地资产库。无账号、无服务端、无埋点，离线也能编辑。"
    />
    <meta name="twitter:image" content="https://xiezongchen.github.io/Spinth/og-image.png" />
    <!-- 首绘前预置主题（防暗色用户白屏闪烁）：逻辑与 src/theme.ts 保持同步 -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('spinth.theme');
          var theme =
            saved === 'dark' || saved === 'light'
              ? saved
              : matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          /* localStorage 不可用时默认浅色 */
        }
      })();
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS「添加到主屏幕」（specs/pwa §7.1/Q4）：状态栏用 default——
         black-translucent 会把状态栏文字刷白压在浅色画布上，对比度不合格 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="spinth" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>spinth — 让想法擦出火花</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
