<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f9fa" />
    <!-- 首绘前预置主题（防暗色用户白屏闪烁）：逻辑与 src/theme.ts 保持同步 -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('spinth.theme');
          var theme =
            saved === 'dark' || saved === 'light'
              ? saved
              : matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          /* localStorage 不可用时默认浅色 */
        }
      })();
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%237C5CFC'/%3E%3Cpath d='M12 4.8c.6 4.3 3.9 7.6 8.2 8.2-4.3.6-7.6 3.9-8.2 8.2-.6-4.3-3.9-7.6-8.2-8.2 4.3-.6 7.6-3.9 8.2-8.2Z' fill='white'/%3E%3C/svg%3E"
    />
    <title>spinth — 让想法擦出火花</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
